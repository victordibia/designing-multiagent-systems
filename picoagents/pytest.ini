[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Integration tests call live provider APIs and cost real quota, so they are
# deselected by default. Run them deliberately with: pytest -m integration
addopts = -v --tb=short -m "not integration"
markers =
    asyncio: marks tests as async (for pytest-asyncio)
    integration: hits a live provider API and consumes quota (deselected by default)